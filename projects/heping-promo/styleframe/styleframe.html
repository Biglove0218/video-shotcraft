<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/barlow-condensed/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/barlow-condensed/700.css">
<style>
/* ---------- direction tokens ---------- */
:root{
  --W:1080px; --H:1920px;
  --sans:"Noto Sans SC",sans-serif;
  --num:"Barlow Condensed","Noto Sans SC",sans-serif;
}
/* A 炉火锻造：暖黑 + 炉火橙，金石感衬线 */
.dirA{ --bg:#0b0806; --ink:#f6ede3; --mute:#bfae9c; --accent:#ff6a1f; --accent2:#ffb04a;
  --display:"Noto Serif SC",serif; --rule:rgba(255,140,60,.35);
  --gradeHot:contrast(1.25) brightness(.62) saturate(.75) sepia(.35);
  --gradeCold:contrast(1.15) brightness(.7) saturate(.6) sepia(.3);
  --tintHot:rgba(255,96,24,.30); --tintCold:rgba(255,120,40,.12); }
/* B 精工冷钢：石墨蓝灰 + 钢银，工程线框 */
.dirB{ --bg:#0b1014; --ink:#eef2f5; --mute:#9aa7b2; --accent:#5cb8ff; --accent2:#c8d4de;
  --display:"Noto Sans SC",sans-serif; --rule:rgba(140,190,255,.35);
  --gradeHot:grayscale(.75) contrast(1.2) brightness(.62);
  --gradeCold:grayscale(.7) contrast(1.15) brightness(.78);
  --tintHot:rgba(40,90,150,.28); --tintCold:rgba(40,90,150,.18); }
/* C 由火入钢：前半炉火暖调（毛坯），转换后冷钢（成品），橙色作为贯穿品牌线 */
.dirC{ --bg:#0a0b0c; --ink:#f3f1ee; --mute:#a9a49e; --accent:#ff6a1f; --accent2:#9cc2ff;
  --display:"Noto Sans SC",sans-serif; --rule:rgba(255,255,255,.22);
  --gradeHot:contrast(1.25) brightness(.6) saturate(.8) sepia(.3);
  --gradeCold:grayscale(.65) contrast(1.15) brightness(.8);
  --tintHot:rgba(255,96,24,.28); --tintCold:rgba(60,110,170,.18); }

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{display:flex;width:calc(var(--W) * 4)}
.frame{position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center}
.tint{position:absolute;inset:0;mix-blend-mode:color}
.grain{position:absolute;inset:-50%;opacity:.10;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,transparent 40%,rgba(0,0,0,.65) 100%)}
.safe{position:absolute;left:72px;right:72px}

/* brand mark: 印章式文字标 */
.seal{display:inline-grid;place-items:center;width:112px;height:112px;border:6px solid var(--accent);border-radius:10px;
  font-family:"Noto Serif SC",serif;font-weight:900;font-size:40px;line-height:1.02;color:var(--accent);writing-mode:vertical-rl;letter-spacing:4px}
.kicker{font-weight:700;font-size:46px;letter-spacing:14px;color:var(--mute)}
.mega{font-family:var(--display);font-weight:900;font-size:132px;line-height:1.08;letter-spacing:2px}
.sub{font-weight:700;font-size:54px;line-height:1.35}
.label{font-weight:700;font-size:44px;letter-spacing:4px}
.chip{display:inline-block;padding:14px 26px;border:2px solid var(--rule);border-radius:999px;font-weight:700;font-size:40px;margin:0 14px 18px 0;background:rgba(0,0,0,.35)}
.accent{color:var(--accent)}
.num{font-family:var(--num);font-weight:700}
.rule{height:3px;background:linear-gradient(90deg,var(--accent),transparent)}

/* corner ticks (B only) */
.ticks{display:none;position:absolute;inset:56px;pointer-events:none}
.dirB .ticks{display:block}
.ticks i{position:absolute;width:44px;height:44px;border-color:var(--accent);border-style:solid;opacity:.8}
.ticks i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}
.ticks i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.ticks i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}
.ticks i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}

/* ---------- F1 opening ---------- */
.f1 .bgimg{background-image:url(img/p1.jpg);filter:var(--gradeHot);transform:scale(1.04)}
.f1 .tint{background:var(--tintHot)}
.f1 .glow{position:absolute;left:-10%;right:-10%;bottom:-8%;height:60%;
  background:radial-gradient(ellipse 60% 55% at 50% 100%,rgba(255,110,30,.55),rgba(255,80,20,.15) 45%,transparent 70%);mix-blend-mode:screen}
.dirB .f1 .glow{background:radial-gradient(ellipse 60% 55% at 50% 100%,rgba(120,180,255,.30),transparent 70%)}
.f1 .topfade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 30%,transparent 52%)}
.f1 .head{top:190px}
.f1 .foot{bottom:330px}

/* ---------- F2 transformation (photo ②) ---------- */
.f2{background:var(--bg)}
.f2 .title{top:170px}
.card{position:absolute;left:72px;right:72px;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.card .im{position:absolute;inset:0;background-size:cover;background-position:center}
.card .tint{position:absolute;inset:0}
.card .tag{position:absolute;left:28px;top:24px;padding:10px 22px;border-radius:12px;background:rgba(0,0,0,.6);font-weight:900;font-size:44px;letter-spacing:6px}
.f2 .c1{top:470px;height:520px}
.f2 .c1 .im{background-image:url(img/p2-blank.jpg);filter:var(--gradeHot)}
.f2 .c1 .tint{background:var(--tintHot);mix-blend-mode:color}
.f2 .c2{top:1110px;height:620px}
.f2 .c2 .im{background-image:url(img/p2-finished.jpg);filter:var(--gradeCold);background-position:50% 40%}
.f2 .c2 .tint{background:var(--tintCold);mix-blend-mode:color}
.f2 .seam{position:absolute;left:72px;right:72px;top:1010px;height:80px;display:flex;align-items:center;gap:22px}
.f2 .seam .bar{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 24px var(--accent)}
.f2 .seam .txt{font-weight:700;font-size:40px;letter-spacing:6px;color:var(--ink)}
.f2 .c1 .tag{color:var(--accent)}
.dirC .f2 .c2 .tag{color:var(--accent2)}

/* ---------- F3 3D weld-neck ---------- */
.f3 .stage{position:absolute;inset:0;background:radial-gradient(ellipse 70% 40% at 50% 62%,rgba(255,255,255,.07),transparent 70%)}
.dirA .f3 .stage{background:radial-gradient(ellipse 70% 40% at 50% 64%,rgba(255,90,20,.20),transparent 70%)}
.dirB .f3 .stage{background:radial-gradient(ellipse 70% 40% at 50% 64%,rgba(90,160,255,.16),transparent 70%)}
.dirC .f3 .stage{background:radial-gradient(ellipse 45% 35% at 32% 64%,rgba(255,90,20,.20),transparent 70%),radial-gradient(ellipse 45% 35% at 70% 64%,rgba(90,160,255,.16),transparent 70%)}
.f3 .model{position:absolute;left:0;top:470px;width:1080px;height:1080px;background-size:contain;background-repeat:no-repeat}
.dirA .f3 .model{background-image:url(img/fl-A.png)}
.dirB .f3 .model{background-image:url(img/fl-B.png)}
.dirC .f3 .model{background-image:url(img/fl-C.png)}
.f3 .title{top:190px}
.f3 .chips{bottom:300px}
.f3 .call{position:absolute;font-weight:900;font-size:44px;letter-spacing:6px}
.f3 .call::after{content:"";position:absolute;top:100%;width:3px;height:120px;background:currentColor;opacity:.6}
.f3 .callL{left:150px;top:640px;color:var(--accent)} .f3 .callL::after{left:20px}
.f3 .callR{right:150px;top:640px;color:var(--accent2)} .f3 .callR::after{right:20px}
.dirB .f3 .callL,.dirB .f3 .callR{display:none}
.f3 .dims{display:none}
.dirB .f3 .dims{display:block}

/* ---------- F4 outro ---------- */
.f4 .bgimg{background-image:url(img/p4.jpg);filter:var(--gradeCold) blur(2px) brightness(.55);transform:scale(1.06)}
.dirA .f4 .bgimg{filter:var(--gradeHot) blur(2px) brightness(.6)}
.f4 .tint{background:var(--tintCold)}
.dirA .f4 .tint{background:var(--tintHot)}
.f4 .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.82) 45%,rgba(0,0,0,.92))}
.f4 .brand{top:170px;display:flex;gap:30px;align-items:center}
.f4 .brand .nm{font-family:var(--display);font-weight:900;font-size:76px;line-height:1.15}
.f4 .brand .nm small{display:block;font-family:var(--sans);font-weight:700;font-size:40px;letter-spacing:10px;color:var(--mute)}
.f4 .specs{top:470px}
.spec{display:grid;grid-template-columns:200px 1fr;gap:0 24px;padding:26px 0;border-top:2px solid var(--rule)}
.spec dt{font-weight:700;font-size:40px;color:var(--mute);letter-spacing:4px}
.spec dd{font-weight:900;font-size:50px;line-height:1.3}
.f4 .contact{top:1150px}
.f4 .phone{font-family:var(--num);font-weight:700;font-size:150px;line-height:1;letter-spacing:4px;color:var(--ink)}
.f4 .who{font-weight:900;font-size:56px;margin-bottom:18px}
.f4 .addr{font-weight:500;font-size:38px;line-height:1.5;color:var(--mute);margin-top:26px}
.f4 .slogan{bottom:300px;font-weight:900;font-size:52px;letter-spacing:6px}
</style>
</head>
<body>
<script>
  const dir = new URLSearchParams(location.search).get('dir') || 'C';
  document.body.className = 'dir' + dir;
</script>

<!-- F1 品牌开场 -->
<section class="frame f1">
  <div class="bgimg"></div><div class="tint"></div><div class="glow"></div><div class="topfade"></div><div class="vignette"></div>
  <div class="safe head">
    <div class="seal">和平</div>
    <div class="kicker" style="margin-top:46px">瑞安市</div>
    <div class="mega">和平机械<br>配件厂</div>
    <div class="rule" style="width:420px;margin:40px 0 34px"></div>
    <div class="sub">锻件源头工厂 · <span class="accent num" style="font-size:64px">20</span> 年老厂</div>
  </div>
  <div class="safe foot"><div class="label" style="color:var(--mute)">毛坯 · 成品 一站供应</div></div>
  <div class="ticks"><i></i><i></i><i></i><i></i></div><div class="grain"></div>
</section>

<!-- F2 毛坯 → 成品（实拍 ②） -->
<section class="frame f2">
  <div class="safe title">
    <div class="kicker">平焊法兰</div>
    <div class="mega" style="font-size:112px">从毛坯到成品</div>
  </div>
  <div class="card c1"><div class="im"></div><div class="tint"></div><div class="tag">毛坯</div></div>
  <div class="seam"><div class="bar"></div><div class="txt">车削 · 钻孔</div><div class="bar"></div></div>
  <div class="card c2"><div class="im"></div><div class="tint"></div><div class="tag">成品</div></div>
  <div class="ticks"><i></i><i></i><i></i><i></i></div><div class="grain"></div>
</section>

<!-- F3 3D 对焊法兰 -->
<section class="frame f3">
  <div class="stage"></div>
  <div class="safe title">
    <div class="kicker">对焊法兰</div>
    <div class="mega" style="font-size:112px">锻造毛坯<br>精车成品</div>
  </div>
  <div class="model"></div>
  <div class="call callL">毛坯</div><div class="call callR">成品</div>
  <svg class="dims" style="position:absolute;left:0;top:470px" width="1080" height="1080" viewBox="0 0 1080 1080">
    <g stroke="#5cb8ff" stroke-width="2" fill="none" opacity=".75">
      <line x1="150" y1="930" x2="930" y2="930"/><line x1="150" y1="905" x2="150" y2="955"/><line x1="930" y1="905" x2="930" y2="955"/>
      <line x1="400" y1="150" x2="680" y2="150"/><line x1="400" y1="130" x2="400" y2="170"/><line x1="680" y1="130" x2="680" y2="170"/>
    </g>
    <g fill="#9aa7b2" font-family="Noto Sans SC" font-weight="700" font-size="34" text-anchor="middle">
      <text x="540" y="995">法兰外径</text><text x="540" y="115">颈部</text>
    </g>
  </svg>
  <div class="safe chips"><span class="chip">自由锻</span><span class="chip">非标定制</span><span class="chip">来图加工</span></div>
  <div class="ticks"><i></i><i></i><i></i><i></i></div><div class="grain"></div>
</section>

<!-- F4 收尾联系 -->
<section class="frame f4">
  <div class="bgimg"></div><div class="tint"></div><div class="shade"></div>
  <div class="safe brand"><div class="seal">和平</div><div class="nm"><small>瑞安市</small>和平机械配件厂</div></div>
  <dl class="safe specs">
    <div class="spec"><dt>执行标准</dt><dd>国标 <span class="num">GB</span></dd></div>
    <div class="spec"><dt>常用材质</dt><dd>碳钢 <span class="num">20# · 16Mn</span><br>不锈钢 <span class="num">304 · 316</span></dd></div>
    <div class="spec" style="border-bottom:2px solid var(--rule)"><dt>服务</dt><dd>可开票 · 全国发货</dd></div>
  </dl>
  <div class="safe contact">
    <div class="who">联系人 <span class="accent">陈和平</span></div>
    <div class="phone">133 5336 3168</div>
    <div class="addr">浙江省温州市瑞安市潘岱街道<br>寺前村老坑底 1 号</div>
  </div>
  <div class="ticks"><i></i><i></i><i></i><i></i></div><div class="grain"></div>
</section>

<script>
  Promise.all([document.fonts.ready, ...[...document.querySelectorAll('img')].map(i => i.decode())])
    .then(() => new Promise(r => setTimeout(r, 300))).then(() => { window.__ready = true; });
</script>
</body>
</html>
